
name: Build Olive and Stone Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'olive_stone_project.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -q olive_stone_project.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"

      - name: Build Android APK
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: project
          export_debug: true
          archive_output: false
          presets_to_export: Android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: olive-and-stone-android-debug-apk
          path: project/build/olive_stone_debug.apk
          if-no-files-found: error
          
