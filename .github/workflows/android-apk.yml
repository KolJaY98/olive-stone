name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack project
        run: |
          rm -rf project
          mkdir project
          unzip -q olive_stone_project.zip -d project
          ls -la project

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"

      - name: Install Godot 4.3 and export templates
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/4.3-stable
          curl -fsSL -o godot.zip "$BASE/Godot_v4.3-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v4.3-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Create debug keystore and Godot editor settings
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.tres"
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Import project
        run: godot --headless --path project --import || true

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path project --export-debug "Android" "$GITHUB_WORKSPACE/build/olive_stone_debug.apk" 2>&1 | tee export.log
          test -s build/olive_stone_debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: olive-stone-debug-apk
          path: build/olive_stone_debug.apk

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: export.log
          if-no-files-found: ignore
